name: iOS Build (Simulador)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

jobs:
  build-ios-simulator:
    name: Build iOS para simulador ARM64
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.1.0

      - name: Build Shared framework (KMP)
        run: ./gradlew :shared:embedAndSignAppleFrameworkForXcode --console=plain

      - name: Build iOS App (simulador)
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Subir log de build como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: |
            iosApp/build.log
          retention-days: 7