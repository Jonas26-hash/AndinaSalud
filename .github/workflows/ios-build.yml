name: iOS Build (Simulador)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

jobs:
  build-ios-simulator:
    name: Build iOS para simulador ARM64
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.1.0

      - name: Build Shared framework (KMP)
        run: ./gradlew :shared:embedAndSignAppleFrameworkForXcode --console=plain --stacktrace
        continue-on-error: true

      - name: Subir log de Gradle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: |
            shared/build/reports/**/*
            shared/build/outputs/**/*
          retention-days: 7

      - name: Build iOS App (simulador)
        if: success()
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log

      - name: Subir log de xcodebuild
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: |
            iosApp/build.log
          retention-days: 7